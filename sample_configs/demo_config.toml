[flags]
avg_cpu = true

# Temperature is one of:
temperature_type = "c"

rate = 1000
current_usage = false
group_processes = false
case_sensitive = false
whole_word = false
regex = false
default_widget_type = "cpu"
default_widget_count = 1

[styles]
theme = "gruvbox"

[cpu]
left_legend = false

[processes]
columns = ["PID", "Name", "CPU%", "Mem%", "Rps", "Wps", "TRead", "TWrite", "State", "Time", "Virt"]

[[row]]
 ratio=30
 [[row.child]]
 type="cpu"
 [[row.child]]
 type="gpu"
[[row]]
   ratio=40
   [[row.child]]
     ratio=4
     type="mem"
   [[row.child]]
     ratio=3
     [[row.child.child]]
       type="temp"
     [[row.child.child]]
       type="disk"
[[row]]
 ratio=30
 [[row.child]]
   type="net"
 [[row.child]]
   type="proc"
   default=true
